- name: Set prometheus_server_ip from monitor group
  set_fact:
    prometheus_server_ip: "{{ hostvars[groups['monitor'][0]]['ansible_host'] }}"
  tags: [monitor, metering_prometheus]

- name: Ensure remote_write for billing metrics is present
  delegate_to: "{{ prometheus_server_ip }}"
  become: true
  tags: [monitor, metering_prometheus]
  blockinfile:
    path: /etc/prometheus/prometheus.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK - remote_write for billing"
    insertafter: '^evaluation_interval:'
    block: |
      remote_write:
        - url: "{{ metering_server_url }}"
          remote_timeout: 60s
          tls_config:
            insecure_skip_verify: true
          queue_config:
            capacity: 15000
            max_shards: 8
            min_shards: 2
            max_samples_per_send: 5000
            batch_send_deadline: 5m
            min_backoff: 30ms
            max_backoff: 5s
          write_relabel_configs:
            - source_labels: [__name__]
              regex: 'libvirt_domain_info_vstate|domain_north_south_.*|libvirt_domain_info_virtual_cpus|libvirt_domain_info_maximum_memory_bytes|libvirt_domain_block_stats_capacity_bytes|vm_instance_map|cloud_snapshot_snap_size_bytes|cloud_snapshot_data_size_bytes|vm_traffic_billing_map'
              action: keep
  when: metering_server_url is defined

- name: Restart prometheus after config change
  delegate_to: "{{ prometheus_server_ip }}"
  tags: [monitor, metering_prometheus]
  systemd:
    name: prometheus
    state: restarted
  when:
    - metering_server_url is defined
