# Add this section into conf/config.toml

[callback]
# Enable resource-change callback
enabled = true

# Callback target URL
# For local test:
url = "http://127.0.0.1:8080/api/v1/resource-changes"
# For remote server, use your reachable endpoint URL

# Authentication
api_key = "test-api-key"

# Region or data center tag for event source
region = "local-test"

# Skip TLS verification (set false in production)
tls_insecure_skip_verify = true

# Worker concurrency (recommended: 3-5)
workers = 3

# Event queue size (recommended: 10000)
queue_size = 10000

# HTTP timeout in seconds (recommended: 30)
timeout = 30

# Maximum retry count (recommended: 3)
retry_max = 3

# Retry interval in seconds (recommended: 5)
retry_interval = 5
